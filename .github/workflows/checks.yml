
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test tests/graphView.test.mjs
      - run: npm audit --omit=dev
  service:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.27-community
        env:
          NEO4J_AUTH: none
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4j 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory services --locked --python 3.12
      - run: uv run --directory services --locked ruff check --config pyproject.toml skillforge ../tests
      - run: uv run --directory services --locked python -m compileall -q skillforge
      - run: uv run --directory services --locked python -m unittest discover -s ../tests -v
