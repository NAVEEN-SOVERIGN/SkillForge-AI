services:
  - type: web
    name: skillforge-integrated
    runtime: docker
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: SCAN_WORKER_ENABLED
        value: "true"
