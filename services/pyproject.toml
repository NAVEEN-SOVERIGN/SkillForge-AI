
[project]
name = "skillforge-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2,<3",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 110
